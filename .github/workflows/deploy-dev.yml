# Push to `dev` -> test -> deploy to the dev Cloud Run service (synkron-backend-dev).

name: Deploy dev

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Never run two dev deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    # A manual run started from any other branch stops here.
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      id-token: write   # OIDC token for Workload Identity Federation
    with:
      environment: dev
      secret_prefix: synkron-dev
      default_db_name: synkron-dev
      max_instances: "2"
      min_instances: "0"
